name: Build Kids English Materials

# 触发：主题词表或脚本有改动时自动构建；也可在 Actions 页面手动点 "Run workflow"
on:
  push:
    paths:
      - 'themes/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统与字体依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core fonts-noto-cjk || true
          sudo apt-get install -y fonts-wqy-zenhei || true
          fc-cache -f || true

      - name: 安装 Python 依赖
        run: python -m pip install --quiet reportlab pillow cairosvg

      - name: 生成站点（PDF 教具 + 点读页）
        run: python scripts/build_site.py

      - name: 提交并推送产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: rebuild materials site"
            git push
          fi
